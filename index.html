<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DailyJon">
<meta name="theme-color" content="#0d1020">
<meta name="description" content="DailyJon — planner harian grid 10 menit dengan asisten AI. Gratis, tanpa iklan.">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>DailyJon</title>
<style>
:root{
  --bg:#f2f2f7;--card:rgba(255,255,255,.82);--solid:#fff;--text:#0b0b0f;--muted:#8a8a8e;--line:rgba(60,60,67,.13);
  --cell:#e6e6eb;--cell-h:#dddde3;--accent:#0A84FF;--accent2:#5E5CE6;--danger:#FF3B30;--ok:#30D158;
  --mono:#c7c7cc;--glass:rgba(255,255,255,.6);--glass-brd:rgba(255,255,255,.75);--glass-hi:rgba(255,255,255,.9);
  --shadow:0 8px 30px rgba(0,0,0,.07);--hdr:58px;--tab:84px;--kb:0px;
  --st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);
}
[data-theme=dark]{
  --bg:#000;--card:rgba(28,28,30,.86);--solid:#1c1c1e;--text:#fff;--muted:#8e8e93;--line:rgba(84,84,88,.38);
  --cell:#262629;--cell-h:#2c2c30;--mono:#3a3a3c;--glass:rgba(36,36,40,.55);--glass-brd:rgba(255,255,255,.13);--glass-hi:rgba(255,255,255,.18);
  --shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior-x:none}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,Inter,sans-serif;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;font-size:15px;min-height:100vh;overscroll-behavior-y:none}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 40% at 0% 0%,color-mix(in srgb,#0A84FF 14%,transparent),transparent 70%),
             radial-gradient(50% 40% at 100% 20%,color-mix(in srgb,#BF5AF2 12%,transparent),transparent 70%),
             radial-gradient(60% 40% at 50% 100%,color-mix(in srgb,#30D158 10%,transparent),transparent 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;font-size:16px;color:var(--text)}
.muted{color:var(--muted)}
[hidden]{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-brd),var(--shadow)}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:30;padding:calc(var(--st) + 8px) 16px 8px;
  background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);
  display:flex;align-items:center;gap:8px;min-height:calc(var(--hdr) + var(--st))}
.h-date{position:relative;flex:1;min-width:0}
.h-title{font-size:24px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-title .chev{font-size:13px;color:var(--muted);margin-left:4px}
.h-sub{font-size:13px;color:var(--muted);margin-top:1px;font-weight:500}
.h-date input{position:absolute;inset:0;opacity:0;width:100%;height:100%;-webkit-appearance:none}
.ibtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.ibtn svg{width:20px;height:20px}
.pill{padding:9px 13px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:13px}
.h-view-title{flex:1;font-size:32px;font-weight:800;letter-spacing:-.8px}
.addbtn{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.addbtn svg{width:22px;height:22px}

/* ---------- Views ---------- */
.view{display:none;padding-bottom:calc(var(--tab) + var(--sb) + 24px)}
.view.active{display:block}

/* now card */
.nowcard{margin:4px 14px 12px;border-radius:24px;padding:14px 16px}
.nc-row{display:flex;align-items:center;gap:12px}
.nc-row .dot{width:12px;height:12px;border-radius:50%;flex:none}
.nc-row .dot.idle{background:var(--mono)}
.nc-main{flex:1;min-width:0}
.nc-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
.nc-title{font-size:18px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nc-right{text-align:right}.nc-right b{display:block;font-size:18px}.nc-right small{color:var(--muted);font-size:11px}
.bar{height:6px;border-radius:6px;background:var(--cell);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.nc-next{font-size:13.5px;color:var(--muted);margin-top:8px}
.nc-next:first-child{margin-top:0}
.nc-next b{color:var(--text)}
.hint{margin:0 14px 10px;font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--accent) 10%,transparent);border-radius:16px;padding:10px 12px;line-height:1.4}
.install{margin:0 14px 12px;font-size:13px;border-radius:18px;padding:10px 12px;display:flex;gap:10px;align-items:center}
.install b{color:var(--accent)}

/* schedule grid */
.grid{padding:0 14px 0 4px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.colhdr{display:grid;grid-template-columns:38px 1fr;position:sticky;top:calc(var(--hdr) + var(--st));z-index:6;
  background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding:4px 0 5px}
.colhdr .cols{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;font-weight:600}
.colhdr .cols span{padding-left:3px}
.row{display:grid;grid-template-columns:38px 1fr;height:40px;margin-bottom:3px}
.hl{font-size:11px;color:var(--muted);text-align:right;padding:3px 8px 0 0;font-variant-numeric:tabular-nums;font-weight:700}
.row.now .hl{color:#FF375F}
.cells{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:3px}
.c{grid-row:1;background:var(--cell);border-radius:9px}
.c:nth-child(-n+3){background:var(--cell-h)}
.row.off .c{opacity:.5}
.seg{grid-row:1;z-index:1;border-radius:9px;padding:2px 7px;font-size:11px;line-height:1.15;color:#fff;overflow:hidden;
  display:flex;flex-direction:column;justify-content:center;font-weight:700;min-width:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.seg .t,.seg small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg small{font-weight:600;opacity:.85;font-size:9.5px;font-variant-numeric:tabular-nums}
.seg.cont .t{opacity:.72;font-weight:600}
.seg.past{filter:saturate(.75);opacity:.86}
.mono .seg{background:var(--mono)!important;color:var(--text)!important}
.selseg{grid-row:1;z-index:2;border-radius:9px;pointer-events:none;background:color-mix(in srgb,var(--accent) 38%,transparent);box-shadow:inset 0 0 0 2px var(--accent)}
.nowline{position:absolute;top:-3px;bottom:-3px;width:3px;margin-left:-1.5px;z-index:3;pointer-events:none;border-radius:2px;
  background:repeating-linear-gradient(180deg,#FF375F 0 4px,transparent 4px 7px)}
.nowline::before{content:"";position:absolute;top:-3px;left:-2.5px;width:8px;height:8px;border-radius:50%;background:#FF375F}
.selinfo{position:fixed;left:50%;top:calc(var(--st) + 10px);transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);
  padding:9px 15px;border-radius:999px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;box-shadow:var(--shadow)}

/* ---------- Floating tab bar ---------- */
nav.tabs{position:fixed;left:12px;right:12px;bottom:calc(var(--sb) + 6px);z-index:40;display:flex;justify-content:space-around;
  padding:6px;border-radius:32px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);font-weight:600;padding:7px 0 6px;position:relative;border-radius:26px;transition:background .2s,color .2s}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
nav.tabs .badge{position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:#FF375F}
body.kb nav.tabs{display:none}

/* ---------- Cards / generic ---------- */
.card{border-radius:24px;padding:16px;margin:12px 14px;scroll-margin-top:100px}
.card h3{margin:0 0 10px;font-size:17px;letter-spacing:-.2px}
.seg-ctl{display:flex;background:var(--cell);border-radius:14px;padding:3px;margin:6px 14px 0}
.seg-ctl button{flex:1;padding:8px;border-radius:11px;font-weight:700;font-size:13.5px;color:var(--muted)}
.seg-ctl button.on{background:var(--solid);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.12)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--cell);border-radius:16px;padding:10px 11px}
.kpi b{display:block;font-size:19px;letter-spacing:-.3px}.kpi span{font-size:11.5px;color:var(--muted)}
.catbar{display:flex;align-items:center;gap:10px;margin:10px 0}
.catbar .nm{width:84px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catbar .tr{flex:1;height:10px;background:var(--cell);border-radius:6px;overflow:hidden}
.catbar .tr i{display:block;height:100%;border-radius:6px}
.catbar .v{width:96px;white-space:nowrap;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.week{display:flex;gap:6px;align-items:flex-end;height:150px;margin-top:6px}
.week .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%}
.week .stack{flex:1;width:100%;display:flex;flex-direction:column-reverse;border-radius:10px;overflow:hidden;background:var(--cell)}
.week .stack i{display:block;width:100%}
.week .lb{font-size:11px;color:var(--muted);font-weight:600}
.week .col.sel .lb{color:var(--accent)}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.list-item:last-child{border-bottom:0}

/* focus */
.ring-wrap{display:grid;place-items:center;margin:18px 0 6px;position:relative}
.ring-wrap svg{width:250px;height:250px;transform:rotate(-90deg)}
.ring-txt{position:absolute;text-align:center}
.ring-txt b{display:block;font-size:48px;font-weight:800;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ring-txt span{color:var(--muted);font-size:13.5px;max-width:180px;display:inline-block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;background:var(--cell);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--accent);color:#fff}
.chip .d{width:10px;height:10px;border-radius:50%}
.chip.on .d{box-shadow:0 0 0 2px #fff}
.btn{padding:14px 16px;border-radius:16px;font-weight:700;background:var(--cell);text-align:center}
.btn.pri{background:var(--accent);color:#fff}
.btn.dan{color:var(--danger)}
.btn-row{display:flex;gap:8px;margin-top:12px}.btn-row .btn{flex:1}

/* settings */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.set-row:last-child{border-bottom:0}
.set-row .lbl{font-size:15px}.set-row .lbl small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.set-row select{background:var(--cell);border:0;border-radius:11px;padding:7px 10px;font-size:14px}
.tg{position:relative;width:51px;height:31px;flex:none}
.tg input{opacity:0;width:0;height:0}
.tg span{position:absolute;inset:0;background:var(--mono);border-radius:31px;transition:.2s}
.tg span::after{content:"";position:absolute;width:27px;height:27px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.tg input:checked+span{background:var(--ok)}
.tg input:checked+span::after{transform:translateX(20px)}
.cat-ed{display:flex;align-items:center;gap:8px;margin:8px 0}
.cat-ed input[type=color]{width:38px;height:34px;border:0;padding:0;background:none;border-radius:10px;-webkit-appearance:none}
.cat-ed input[type=color]::-webkit-color-swatch-wrapper{padding:0}
.cat-ed input[type=color]::-webkit-color-swatch{border:0;border-radius:10px}
.cat-ed input[type=text]{flex:1;background:var(--cell);border:0;border-radius:11px;padding:8px 10px}
.cat-ed button{width:34px;height:34px;border-radius:11px;background:var(--cell);color:var(--danger);font-weight:800}
.small{font-size:12.5px;color:var(--muted);line-height:1.45}
.prog{height:8px;border-radius:6px;background:var(--cell);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .3s}

/* chat */
.chat{padding:6px 14px 8px}
.msg{max-width:88%;padding:10px 14px;border-radius:20px;margin:7px 0;white-space:pre-wrap;line-height:1.42;font-size:15px;word-wrap:break-word}
.msg.me{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.msg.ai{background:var(--card);box-shadow:inset 0 0 0 1px var(--glass-brd),var(--shadow);border-bottom-left-radius:6px}
.msg .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.msg .acts button{padding:7px 12px;border-radius:12px;background:var(--cell);font-weight:700;font-size:13px}
.msg .acts button.pri{background:var(--accent);color:#fff}
.msg.typing{color:var(--muted)}
.ai-head{display:flex;align-items:center;gap:8px}
.ai-badge{font-size:11.5px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--cell);color:var(--muted)}
.ai-badge.smart{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.sugs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.sugs::-webkit-scrollbar{display:none}
.sugs .chip{white-space:nowrap;flex:none}
.chatbar{position:fixed;left:12px;right:12px;z-index:35;bottom:calc(var(--tab) + var(--sb) + 2px);padding:6px;display:flex;gap:8px;border-radius:30px}
body.kb .chatbar{bottom:calc(var(--kb) + 6px)}
.chatbar input{flex:1;border:0;background:transparent;padding:10px 12px;outline:none}
.chatbar button{width:42px;height:42px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;flex:none}
.chatbar button svg{width:20px;height:20px}
#view-ai{padding-bottom:calc(var(--tab) + var(--sb) + 80px)}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);z-index:70;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:var(--kb);z-index:80;background:color-mix(in srgb,var(--solid) 92%,transparent);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border-radius:32px 32px 0 0;
  padding:8px 18px calc(var(--sb) + 18px);max-height:90vh;overflow:auto;transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);
  box-shadow:0 -10px 40px rgba(0,0,0,.25),inset 0 1px 0 var(--glass-hi);-webkit-overflow-scrolling:touch}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:5px;background:var(--mono);margin:4px auto 12px}
.sh-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px}
.sh-head b{font-size:20px;letter-spacing:-.3px}.sh-head span{font-size:13px;color:var(--muted)}
.fld{width:100%;border:0;background:var(--cell);border-radius:16px;padding:13px 14px;outline:none}
textarea.fld{resize:none;height:70px;margin-top:10px}
.trow{display:flex;align-items:flex-end;gap:8px;margin:12px 0}
.trow label{flex:1;font-size:12px;color:var(--muted);font-weight:600}
.trow select{display:block;width:100%;margin-top:4px;border:0;background:var(--cell);border-radius:14px;padding:11px 10px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none;font-weight:700}
.trow .arrow{padding-bottom:12px;color:var(--muted)}
.trow .dur{flex:none;min-width:64px;text-align:right;font-weight:700;padding-bottom:12px;font-size:14px}
.sec-lbl{font-size:12px;color:var(--muted);font-weight:700;margin:14px 0 7px;text-transform:uppercase;letter-spacing:.6px}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px;width:100%;text-align:left}
.menu-item:last-child{border-bottom:0}
.menu-item.dan{color:var(--danger)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tab) + var(--sb) + 10px);transform:translate(-50%,30px);opacity:0;z-index:90;
  background:var(--text);color:var(--bg);padding:12px 16px;border-radius:18px;font-weight:600;font-size:14px;display:flex;gap:12px;align-items:center;
  transition:.25s;pointer-events:none;max-width:92vw;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:#0A84FF;font-weight:800}
body.v-ai .toast{bottom:calc(var(--tab) + var(--sb) + 70px)}

/* ================= KEBIASAAN ================= */
.hweek{display:flex;gap:4px;margin:2px 10px 6px;align-items:center}
.hweek .nav{width:26px;height:44px;color:var(--muted);font-size:18px;flex:none}
.hday{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 8px;border-radius:18px;font-weight:600}
.hday .wd{font-size:11px;color:var(--muted);text-transform:uppercase}
.hday .ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:13.5px;font-weight:700;
  background:conic-gradient(var(--ok) calc(var(--p)*1%),var(--cell) 0)}
.hday .ring span{width:27px;height:27px;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.hday.full .ring span{background:var(--ok);color:#fff}
.hday.sel{background:var(--card);box-shadow:inset 0 0 0 1px var(--glass-brd),var(--shadow)}
.hday.sel .wd{color:var(--accent)}
.hday.fut{opacity:.45}
.hsum{display:flex;align-items:center;gap:16px}
.bigring{width:74px;height:74px;flex:none;position:relative}
.bigring svg{width:100%;height:100%;transform:rotate(-90deg)}
.bigring b{position:absolute;inset:0;display:grid;place-items:center;font-size:18px;font-weight:800;letter-spacing:-.3px}
.hsum .t1{font-size:19px;font-weight:800;letter-spacing:-.3px}
.hsum .t2{font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.hgroup{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin:18px 20px 6px;display:flex;justify-content:space-between}
.hcard{position:relative;margin:10px 14px;border-radius:24px;padding:12px 12px 12px 12px;overflow:hidden;touch-action:pan-y;-webkit-user-select:none;user-select:none;
  background:var(--card);box-shadow:inset 0 1px 0 var(--glass-hi),inset 0 0 0 1px var(--glass-brd),var(--shadow);transition:transform .15s}
.hcard:active{transform:scale(.985)}
.hcard.dragging{transform:scale(1.01)}
.hfill{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--hc) 17%,transparent);transition:width .25s;pointer-events:none}
.hcard.dragging .hfill{transition:none;background:color-mix(in srgb,var(--hc) 28%,transparent)}
.hrow{position:relative;display:flex;align-items:center;gap:12px}
.hicon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:24px;flex:none;
  background:color-mix(in srgb,var(--hc) 22%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--hc) 35%,transparent)}
.hmain{flex:1;min-width:0}
.hname{font-size:16.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hsub{font-size:13px;color:var(--muted);margin-top:2px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.hsub .st{color:#FF9F0A;font-weight:700}

  background:conic-gradient(var(--hc) calc(var(--p)*1%),var(--cell) 0)}

<body>
<div class="bgfx"></div>

  <button class="ibtn glass" id="btnBack" aria-label="Kembali" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="h-date" id="hDate">
    <div class="h-title" id="hTitle">DailyJon</div>
    <div class="h-sub" id="hSub"></div>
    <input type="date" id="datePick" aria-label="Pilih tanggal">
  </div>
  <div class="h-view-title" id="hViewTitle" hidden></div>
  <button class="pill" id="btnToday" hidden>Hari ini</button>
  <button class="ibtn glass" id="btnPrev" aria-label="Hari sebelumnya"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>

<script>
'use strict';
/* =========================================================
   DailyJon — planner grid harian + asisten AI
   Semua data tersimpan di perangkat (localStorage). Tanpa iklan, tanpa server.
   ========================================================= */
const APP_VER = '1.3.0';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const diffDays = (a, b) => Math.round((parseYmd(a) - parseYmd(b)) / 864e5);
const today = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const fmtMin = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const fmtDur = m => { m = Math.round(m); if (m < 60) return `${m} mnt`; const h = Math.floor(m / 60), r = m % 60; return r ? `${h}j ${r}m` : `${h} jam`; };
const HARI = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const HARI_S = ['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
const BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BULAN_FULL = ['januari','februari','maret','april','mei','juni','juli','agustus','september','oktober','november','desember'];
const fmtDate = s => { const d = parseYmd(s); return `${HARI[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}`; };
function fmtDateRel(s) {
  const n = diffDays(s, today());
  const d = parseYmd(s), short = `${HARI_S[d.getDay()]}, ${d.getDate()} ${BULAN[d.getMonth()]}`;
  if (n === 0) return `hari ini (${short})`;
  if (n === 1) return `besok (${short})`;
  if (n === 2) return `lusa (${short})`;
  if (n === -1) return `kemarin (${short})`;
  return fmtDate(s);
}

const DEFAULT_CATS = [
  {id:'kerja', name:'Kerja', color:'#0A84FF'},
  {id:'belajar', name:'Belajar', color:'#BF5AF2'},
  {id:'olahraga', name:'Olahraga', color:'#30D158'},
  {id:'ibadah', name:'Ibadah', color:'#00C7BE'},
  {id:'istirahat', name:'Istirahat', color:'#FF9F0A'},
  {id:'pribadi', name:'Pribadi', color:'#FF375F'},
  {id:'lainnya', name:'Lainnya', color:'#8E8E93'}
];
const AI_MODELS = [
  {id:'Qwen2.5-0.5B-Instruct-q4f16_1-MLC', name:'Ringan · Qwen 0.5B (±0,4 GB)'},
  {id:'Llama-3.2-1B-Instruct-q4f16_1-MLC', name:'Seimbang · Llama 1B (±0,9 GB)'},
  {id:'Qwen2.5-1.5B-Instruct-q4f16_1-MLC', name:'Pintar · Qwen 1.5B (±1,2 GB)'}
];

/* ---------------- State ---------------- */
const KEY = 'dailyjon.v1';
let S;
function defaults() {
  return {
    v: 1, cats: DEFAULT_CATS.map(c => ({...c})), days: {}, chat: [], timer: null, notified: {}, lastCat: 'pribadi', habits: [], hlog: {}, htimer: null, synced: {},
    settings: {theme:'auto', mono:false, remindBefore:5, remindDefault:true, dayStart:6, dayEnd:23,
      aiModel: AI_MODELS[0].id, aiAuto:false, aiLoadedOnce:false, hideHint:false, hideInstall:false, startTab:'plan', scMode:'off', scAlarm:true, scName:'DailyJon Sinkron', scGuided:false, pushUrl:'', pushKey:'', pushOn:false, pushToken:'', pushHash:''}
  };
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const d = JSON.parse(raw), def = defaults();
      S = {...def, ...d, settings: {...def.settings, ...(d.settings || {})}};
      if (!Array.isArray(S.cats) || !S.cats.length) S.cats = def.cats;
      if (!S.days || typeof S.days !== 'object') S.days = {};
      if (!Array.isArray(S.chat)) S.chat = [];
      if (!Array.isArray(S.habits)) S.habits = [];
      if (!S.hlog || typeof S.hlog !== 'object') S.hlog = {};
      if (!S.notified) S.notified = {};
      if (!S.synced || typeof S.synced !== 'object') S.synced = {};
      return;
    }
  } catch (e) {}
  S = defaults();
}
let saveT;
function save() { clearTimeout(saveT); saveT = setTimeout(saveNow, 150); if (typeof pushScheduleSoon === 'function') pushScheduleSoon(); }
function saveNow() {
  clearTimeout(saveT);
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('Gagal menyimpan — memori penyimpanan penuh?'); }
}
load();
let viewDate = today();
let view = 'plan';

/* ---------------- Data helpers ---------------- */
const getDay = d => S.days[d] || [];
function setDay(d, arr) { arr.sort((a, b) => a.start - b.start); if (arr.length) S.days[d] = arr; else delete S.days[d]; if (typeof markDaysDirty === 'function') markDaysDirty(); }
function catOf(id) { return S.cats.find(c => c.id === id) || S.cats.find(c => c.id === 'lainnya') || S.cats[S.cats.length - 1]; }
// Menaruh blok: bagian blok lama yang tertimpa akan dipotong/dipecah (seperti mewarnai grid)
function placeBlock(date, blk, excludeId) {
  const out = [];
  for (const b of getDay(date)) {
    if (b.id === excludeId) continue;
    if (b.end <= blk.start || b.start >= blk.end) { out.push(b); continue; }
    if (b.start < blk.start) out.push({...b, end: blk.start});
    if (b.end > blk.end) out.push({...b, id: b.start < blk.start ? uid() : b.id, start: blk.end});
  }
  out.push(blk);
  setDay(date, out);
}
const overlaps = (date, s, e, exId) => getDay(date).some(b => b.id !== exId && b.start < e && b.end > s);
function freeSlots(date, minLen = 30) {
  const ds = S.settings.dayStart * 60, de = S.settings.dayEnd * 60;
  let t = ds; if (date === today()) t = Math.max(ds, Math.ceil(nowMin() / 10) * 10);
  const out = [];
  for (const b of getDay(date)) {
    if (b.end <= t) continue;
    if (b.start >= de) break;
    if (b.start > t && Math.min(b.start, de) - t >= minLen) out.push([t, Math.min(b.start, de)]);
    t = Math.max(t, b.end);
  }
  if (de - t >= minLen) out.push([t, de]);
  return out;
}
function recentTitles() {
  const m = new Map();
  for (const [d, arr] of Object.entries(S.days)) for (const b of arr) {
    const k = b.title.trim().toLowerCase(); if (!k) continue;
    const o = m.get(k) || {title: b.title, cat: b.cat, n: 0, last: ''};
    o.n++; if (d >= o.last) { o.last = d; o.cat = b.cat; o.title = b.title; }
    m.set(k, o);
  }
  return [...m.values()].sort((a, b) => b.n - a.n || (b.last > a.last ? 1 : -1));
}
let undoSnap = null, undoKey = 0;
function snap() { undoSnap = {days: JSON.stringify(S.days), habits: JSON.stringify(S.habits), hlog: JSON.stringify(S.hlog), key: ++undoKey}; return undoKey; }
function undo(key) {
  if (!undoSnap || (key && undoSnap.key !== key)) { toast('Tidak ada yang bisa diurungkan'); return; }
  S.days = JSON.parse(undoSnap.days); S.habits = JSON.parse(undoSnap.habits); S.hlog = JSON.parse(undoSnap.hlog); undoSnap = null; save(); renderAll(); markDaysDirty(); toast('Diurungkan ↩︎');
}

/* ---------------- Theme ---------------- */
const mq = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.settings.theme === 'auto' ? (mq.matches ? 'dark' : 'light') : S.settings.theme;
  document.documentElement.dataset.theme = t;
  $('meta[name=theme-color]').content = t === 'dark' ? '#0d1020' : '#f5f6fb';
  document.body.classList.toggle('mono', !!S.settings.mono);
}
mq.addEventListener?.('change', applyTheme);
function textOn(hex) {
  const h = hex.replace('#', ''); if (h.length < 6) return '#fff';
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.68 ? '#111827' : '#fff';
}

/* ---------------- Toast / sheet ---------------- */
function toast(msg, {undoK = 0, ms = 2600, action = null} = {}) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undoK ? '<button id="tUndo">Urungkan</button>' : ''}${action ? `<button id="tAct">${esc(action.label)}</button>` : ''}`;
  t.classList.add('show');
  if (undoK) $('#tUndo').onclick = () => { undo(undoK); t.classList.remove('show'); };
  if (action) $('#tAct').onclick = () => { t.classList.remove('show'); action.fn(); };
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), undoK || action ? Math.max(ms, 5000) : ms);
}
function openSheet(html) {
  $('#sheetBody').innerHTML = html; $('#sheet').scrollTop = 0;
  $('#sheet').classList.add('open'); $('#backdrop').classList.add('open');
}
function closeSheet() { $('#sheet').classList.remove('open'); $('#backdrop').classList.remove('open'); document.activeElement?.blur?.(); }
$('#backdrop').onclick = closeSheet;
// tarik ke bawah untuk menutup sheet
(() => { let y0 = null; const sh = $('#sheet');
  sh.addEventListener('touchstart', e => { y0 = sh.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
  sh.addEventListener('touchend', e => { if (y0 != null && e.changedTouches[0].clientY - y0 > 90) closeSheet(); y0 = null; }, {passive: true});
})();

/* ---------------- Feedback (suara/getar) ---------------- */
let actx = null;
function unlockAudio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
document.addEventListener('touchend', unlockAudio, {once: true});
document.addEventListener('click', unlockAudio, {once: true});
function beep(times = 2) {
  try { unlockAudio(); if (!actx) return;
    for (let i = 0; i < times; i++) { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = 880;
      const t0 = actx.currentTime + i * 0.28; g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(0.25, t0 + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
      o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + 0.25); }
  } catch (e) {}
}
const haptic = () => { try { navigator.vibrate?.(12); } catch (e) {} };
async function notify(title, body) {
  toast(`🔔 ${title}${body ? ' — ' + body : ''}`, {ms: 6000}); beep(3);
  try {
    if (typeof pushOn === 'function' && pushOn()) return; // notifikasi sistem dikirim server push → hindari dobel
    if ('Notification' in window && Notification.permission === 'granted') {
      const reg = await navigator.serviceWorker?.getRegistration?.();
      if (reg) reg.showNotification(title, {body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: title});
      else new Notification(title, {body});
    }
  } catch (e) {}
}

let rowsEl = [], cellsEl = [];
function buildGrid() {
  let h = '<div class="colhdr"><div></div><div class="cols">' + [0,10,20,30,40,50].map(x => `<span>:${pad(x)}</span>`).join('') + '</div></div>';
  for (let i = 0; i < 24; i++) {
    h += `<div class="row" data-h="${i}"><div class="hl">${pad(i)}</div><div class="cells">`;
    for (let c = 0; c < 6; c++) h += `<div class="c" style="grid-column:${c + 1}"></div>`;
    h += '</div></div>';
  }
  $('#grid').innerHTML = h;
  rowsEl = $$('.row', $('#grid')); cellsEl = rowsEl.map(r => $('.cells', r));
}
function renderBlocks() {
  $$('#grid .seg').forEach(e => e.remove());
  const isT = viewDate === today(), m = nowMin(), isPast = viewDate < today();
  for (const b of getDay(viewDate)) {
    const c = catOf(b.cat); let first = true;
    for (let h = Math.floor(b.start / 60); h <= Math.floor((b.end - 1) / 60); h++) {
      const s = Math.max(b.start, h * 60), e = Math.min(b.end, h * 60 + 60);
      const c1 = (s - h * 60) / 10, c2 = (e - h * 60) / 10, w = c2 - c1;
      const d = document.createElement('div');
      d.className = 'seg' + (first ? '' : ' cont') + ((isPast || (isT && b.end <= m)) ? ' past' : '');
      d.dataset.id = b.id;
      d.style.gridColumn = `${c1 + 1} / ${c2 + 1}`;
      d.style.background = c.color; d.style.color = textOn(c.color);
      if (first) d.innerHTML = `<span class="t">${esc(b.title)}</span>${w >= 3 ? `<small>${fmtMin(b.start)}–${fmtMin(b.end)}</small>` : ''}`;
      else if (w >= 2) d.innerHTML = `<span class="t">${esc(b.title)}</span>`;
      cellsEl[h].appendChild(d); first = false;
    }
  }
  // jam di luar jam aktif dibuat lebih redup
  rowsEl.forEach((r, i) => r.classList.toggle('off', i < S.settings.dayStart || i >= S.settings.dayEnd));
  renderNowLine();
}
function renderNowLine() {
  $$('#grid .nowline').forEach(e => e.remove());
  rowsEl.forEach(r => r.classList.remove('now'));
  if (viewDate !== today()) return;
  const d = new Date(), h = d.getHours(), pct = (d.getMinutes() + d.getSeconds() / 60) / 60 * 100;
  const ln = document.createElement('div'); ln.className = 'nowline'; ln.style.left = pct + '%';
  cellsEl[h].appendChild(ln); rowsEl[h].classList.add('now');
}
function renderNow() {
  const el = $('#nowCard'), blocks = getDay(viewDate);
  if (viewDate === today()) {
    const m = nowMin(), cur = blocks.find(b => b.start <= m && m < b.end), nxt = blocks.find(b => b.start > m);
    let h = '';
    if (cur) {
      const c = catOf(cur.cat), p = (m - cur.start) / (cur.end - cur.start) * 100;
      h += `<div class="nc-row"><span class="dot" style="background:${c.color}"></span><div class="nc-main"><div class="nc-label">Sekarang · ${fmtMin(cur.start)}–${fmtMin(cur.end)}</div><div class="nc-title">${esc(cur.title)}</div><div class="bar"><i style="width:${p}%;background:${c.color}"></i></div></div><div class="nc-right"><b>${fmtDur(cur.end - m)}</b><small>tersisa</small></div></div>`;
    } else {
      h += `<div class="nc-row"><span class="dot idle"></span><div class="nc-main"><div class="nc-label">Sekarang · ${fmtMin(m)}</div><div class="nc-title muted">Waktu luang</div></div></div>`;
    }

    if (S.timer) h += `<div class="nc-next" id="ncFocus" style="color:var(--accent);font-weight:700">⏱️ Fokus berjalan: ${esc(S.timer.label)} — ketuk untuk melihat</div>`;

/* ---- interaksi grid: tekan-lama + geser, ketuk ---- */
let sel = null, lpT = null, startPt = null, lastPt = null, lastTouch = 0, justSel = 0, scrollRAF = null, mouseDown = false;
function idxFromPoint(x, y) {
  const el = document.elementFromPoint(x, y); const row = el?.closest?.('.row'); if (!row) return null;
  const h = +row.dataset.h, r = cellsEl[h].getBoundingClientRect();
  return h * 6 + clamp(Math.floor((x - r.left) / r.width * 6), 0, 5);
}
function renderSel() {
  $$('#grid .selseg').forEach(e => e.remove());
  const info = $('#selInfo');
  if (!sel) { info.hidden = true; return; }
  const s = Math.min(sel.a, sel.b), e = Math.max(sel.a, sel.b) + 1;
  for (let h = Math.floor(s / 6); h <= Math.floor((e - 1) / 6); h++) {
    const c1 = Math.max(s, h * 6) - h * 6, c2 = Math.min(e, h * 6 + 6) - h * 6;
    const d = document.createElement('div'); d.className = 'selseg'; d.style.gridColumn = `${c1 + 1} / ${c2 + 1}`; cellsEl[h].appendChild(d);
  }
  info.hidden = false; info.textContent = `${fmtMin(s * 10)} – ${fmtMin(e * 10)} · ${fmtDur((e - s) * 10)}`;
}
function beginSel(i) { sel = {a: i, b: i}; renderSel(); haptic(); }
function updateSel(i) { if (sel && i != null && i !== sel.b) { sel.b = i; renderSel(); } }
function endSel() {
  if (!sel) return;
  const s = Math.min(sel.a, sel.b), e = Math.max(sel.a, sel.b) + 1;
  sel = null; renderSel(); stopAutoScroll(); justSel = Date.now();
  openBlockSheet({date: viewDate, start: s * 10, end: e * 10});
}
function autoScrollLoop() {
  if (!sel || !lastPt) { scrollRAF = null; return; }
  const top = document.querySelector('header').offsetHeight + 30, bot = innerHeight - ($('#tabs').offsetHeight + 40);
  let dy = 0; if (lastPt.y < top) dy = -Math.min(18, (top - lastPt.y) / 3 + 4); else if (lastPt.y > bot) dy = Math.min(18, (lastPt.y - bot) / 3 + 4);
  if (dy) { scrollBy(0, dy); updateSel(idxFromPoint(lastPt.x, clamp(lastPt.y, top, bot))); }
  scrollRAF = requestAnimationFrame(autoScrollLoop);
}
function stopAutoScroll() { if (scrollRAF) cancelAnimationFrame(scrollRAF); scrollRAF = null; }
const grid = $('#grid');
grid.addEventListener('touchstart', e => {
  lastTouch = Date.now();
  if (e.touches.length > 1) { clearTimeout(lpT); return; }
  const t = e.touches[0]; startPt = {x: t.clientX, y: t.clientY, t: Date.now()}; lastPt = {...startPt};
  const i = idxFromPoint(t.clientX, t.clientY); if (i == null) return;
  clearTimeout(lpT); lpT = setTimeout(() => { lpT = null; beginSel(i); if (!scrollRAF) scrollRAF = requestAnimationFrame(autoScrollLoop); }, 280);
}, {passive: true});
grid.addEventListener('touchmove', e => {
  const t = e.touches[0]; lastPt = {x: t.clientX, y: t.clientY};
  if (sel) { e.preventDefault(); updateSel(idxFromPoint(t.clientX, t.clientY)); }
  else if (lpT && (Math.abs(t.clientX - startPt.x) > 8 || Math.abs(t.clientY - startPt.y) > 8)) { clearTimeout(lpT); lpT = null; }
}, {passive: false});
grid.addEventListener('touchend', e => {
  lastTouch = Date.now(); clearTimeout(lpT); lpT = null;
  if (sel) { e.preventDefault(); endSel(); return; }
  // geser horizontal untuk ganti hari
  const t = e.changedTouches[0];
  if (startPt) { const dx = t.clientX - startPt.x, dy = t.clientY - startPt.y;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 45 && Date.now() - startPt.t < 600) { justSel = Date.now(); setDate(addDays(viewDate, dx < 0 ? 1 : -1)); } }
}, {passive: false});
grid.addEventListener('touchcancel', () => { clearTimeout(lpT); lpT = null; if (sel) { sel = null; renderSel(); stopAutoScroll(); } });
// mouse (desktop)
grid.addEventListener('mousedown', e => {
  if (Date.now() - lastTouch < 900 || e.button !== 0) return;
  const i = idxFromPoint(e.clientX, e.clientY); if (i == null) return;
  if (e.target.closest('.seg')) return; // klik pada kegiatan = edit
  mouseDown = true; startPt = {x: e.clientX, y: e.clientY}; beginSel(i); e.preventDefault();
});
addEventListener('mousemove', e => { if (mouseDown && sel) { lastPt = {x: e.clientX, y: e.clientY}; updateSel(idxFromPoint(e.clientX, e.clientY)); if (!scrollRAF) scrollRAF = requestAnimationFrame(autoScrollLoop); } });
addEventListener('mouseup', () => { if (mouseDown) { mouseDown = false; endSel(); } });
grid.addEventListener('click', e => {
  if (Date.now() - justSel < 500) return;
  const seg = e.target.closest('.seg');
  if (seg) { openBlockSheet({date: viewDate, id: seg.dataset.id}); return; }
  const i = idxFromPoint(e.clientX, e.clientY); if (i == null) return;
  openBlockSheet({date: viewDate, start: i * 10, end: i * 10 + 10});
});

/* =========================================================
   VIEW: STATISTIK
   ========================================================= */
let statRange = 'day';
const weekStart = d => addDays(d, -((parseYmd(d).getDay() + 6) % 7));
function sumByCat(dates) {
  const m = {}; let tot = 0;
  for (const d of dates) for (const b of getDay(d)) { m[b.cat] = (m[b.cat] || 0) + b.end - b.start; tot += b.end - b.start; }
  return {m, tot};
}
function renderStats() {
  const el = $('#view-stats');
  const dates = statRange === 'day' ? [viewDate] : Array.from({length: 7}, (_, i) => addDays(weekStart(viewDate), i));
  const {m, tot} = sumByCat(dates);
  const prevDates = dates.map(d => addDays(d, -dates.length));
  const prev = sumByCat(prevDates).tot;
  const cats = Object.entries(m).sort((a, b) => b[1] - a[1]);
  const max = cats.length ? cats[0][1] : 1;
  const activeMin = (S.settings.dayEnd - S.settings.dayStart) * 60 * dates.length;
  const titles = {}; dates.forEach(d => getDay(d).forEach(b => { titles[b.title] = (titles[b.title] || 0) + b.end - b.start; }));
  const topT = Object.entries(titles).sort((a, b) => b[1] - a[1]).slice(0, 6);
  const label = statRange === 'day' ? fmtDate(viewDate) : `${fmtDate(dates[0]).split(', ')[1]} – ${fmtDate(dates[6]).split(', ')[1]}`;
  let h = `<div class="seg-ctl"><button data-r="day" class="${statRange === 'day' ? 'on' : ''}">Hari</button><button data-r="week" class="${statRange === 'week' ? 'on' : ''}">Minggu</button></div>
  <div class="card glass"><h3>${esc(label)}</h3><div class="kpis">
    <div class="kpi"><b>${fmtDur(tot)}</b><span>terjadwal</span></div>

function timerRemain() { const t = S.timer; if (!t) return 0; return t.paused != null ? t.paused : t.endAt - Date.now(); }
function startTimer(min, label) { S.timer = {endAt: Date.now() + min * 60000, total: min * 60000, label, paused: null}; save(); renderFocus(); unlockAudio(); }

  el.innerHTML = `

      <defs><linearGradient id="gr"><stop offset="0" stop-color="#4F7CFF"/><stop offset="1" stop-color="#7C5CFF"/></linearGradient></defs></svg>
      <div class="ring-txt"><b id="ringTime">${big}</b><span>${t ? esc(t.label) + (t.paused != null ? ' · dijeda' : '') : 'Pilih durasi fokus'}</span></div></div>
    ${t ? `<div class="card glass"><div class="btn-row" style="margin:0"><button class="btn" id="tStop">Hentikan</button><button class="btn pri" id="tPause">${t.paused != null ? 'Lanjutkan' : 'Jeda'}</button></div><div class="btn-row"><button class="btn" id="tAdd">+5 menit</button></div></div>` : `
    <div class="card glass"><h3>Mulai fokus</h3><div class="chips">
      ${cur ? `<button class="chip on" data-m="${cur.end - m}" data-l="${esc(cur.title)}">▶︎ ${esc(cur.title)} (${fmtDur(cur.end - m)})</button>` : ''}

    </div>
    <div class="trow"><label>Durasi lain (menit)<input class="fld" id="tCustom" type="number" inputmode="numeric" min="1" max="600" placeholder="mis. 30" style="margin-top:4px"></label><button class="btn pri" id="tGo" style="flex:none">Mulai</button></div>
    <div class="small">Timer tetap berjalan walau aplikasi ditutup; bunyi & notifikasi muncul saat aplikasi dibuka/aktif.</div></div>`}
  `;
  if (t) {
    $('#tStop').onclick = () => { S.timer = null; save(); renderFocus(); };
    $('#tPause').onclick = () => { if (t.paused != null) { t.endAt = Date.now() + t.paused; t.paused = null; } else t.paused = Math.max(0, t.endAt - Date.now()); save(); renderFocus(); };
    $('#tAdd').onclick = () => { if (t.paused != null) t.paused += 300000; else t.endAt += 300000; t.total += 300000; save(); renderFocus(); };
  } else {
    $$('#view-focus .chip').forEach(b => b.onclick = () => startTimer(+b.dataset.m, b.dataset.l));
    $('#tGo').onclick = () => { const v = +$('#tCustom').value; if (v > 0) startTimer(Math.min(600, v), `Fokus ${v} menit`); else toast('Isi durasi dulu'); };
  }
}
function tickTimer() {
  const t = S.timer; if (!t) return;
  const rem = timerRemain();
  if (t.paused == null && rem <= 0) { const lb = t.label; S.timer = null; save(); notify('Waktu fokus selesai ✅', lb); renderFocus(); return; }
  if (view === 'focus' && $('#ringTime')) {

  }
}

/* ---------------- Pengingat ---------------- */
function checkReminders() {
  const d = today(), m = nowMin(), before = +S.settings.remindBefore || 0;
  for (const b of getDay(d)) {
    if (!b.remind) continue;
    const k = `${d}|${b.id}|${b.start}`;
    if (S.notified[k]) continue;
    if (m >= b.start - before && m < b.start + 5) {
      S.notified[k] = 1; save();
      notify(b.start - m > 0 ? `${b.title} mulai ${b.start - m} menit lagi` : `Saatnya: ${b.title}`, `${fmtMin(b.start)}–${fmtMin(b.end)}`);
    }
  }
  // bersihkan catatan lama
  for (const k of Object.keys(S.notified)) if (k.slice(0, 10) < addDays(d, -2)) delete S.notified[k];
}

let hDate = today(), hCalMonth = null, hDetailId = null;

const fmtNum = n => (Math.round(n * 10) / 10).toLocaleString('id-ID');

function hLog(d, id) { return S.hlog[d]?.[id] || null; }

const hById = id => S.habits.find(h => h.id === id);

function hGoal(h) { return h.type === 'check' ? 1 : h.type === 'list' ? Math.max(1, (h.steps || []).length) : Math.max(0.1, +h.goal || 1); }
function hRunMin(h, d) { const t = S.htimer; return t && t.hid === h.id && t.date === d ? (Date.now() - t.startAt) / 60000 : 0; }
function hVal(h, d) {

  return (l?.v || 0) + (h.type === 'timer' ? hRunMin(h, d) : 0);
}
const hFailed = (h, d) => !!hLog(d, h.id)?.failed;
function hDone(h, d) { if (hFailed(h, d)) return false; const v = hVal(h, d), g = hGoal(h); return h.limit ? v <= g : v >= g - 1e-9; }
const hFrac = (h, d) => clamp(hVal(h, d) / hGoal(h), 0, 1);
function hSched(h, d) {

}
function hStreak(h) {

function refreshHabitCard(id) {

  card.querySelector('.hsub').innerHTML = hSubHtml(h, hDate);

}

/* ---- aksi ---- */
function hCommit(h, d, fn) {
  const was = hDone(h, d);
  fn(); save();
  if (!h.limit && !was && hDone(h, d)) { haptic(); const s = hStreak(h); toast(`🎉 ${h.name} selesai!${s > 1 ? ` 🔥 ${s} hari beruntun` : ''}`); }
  renderHabits(); if (view === 'stats') renderStats();
}
function hAction(h, a, d) {
  const g = hGoal(h);
  if (a === 'unfail') return hCommit(h, d, () => hSet(d, h.id, {failed: false}));
  if (a === 'tog') return hCommit(h, d, () => hSet(d, h.id, {v: hDone(h, d) && !h.limit ? 0 : 1}));
  if (a === 'inc') {
    if (h.limit || g > 20 || hDone(h, d)) return openValueSheet(h, d);
    return hCommit(h, d, () => hSet(d, h.id, {v: (hLog(d, h.id)?.v || 0) + 1}));
  }
  if (a === 'tmr') { if (d !== today()) return openValueSheet(h, d); toggleHTimer(h); return; }
  if (a === 'list') return openStepsSheet(h, d);
}
function toggleHTimer(h) {
  const t = S.htimer;
  if (t && t.hid === h.id && t.date === today()) { stopHTimer(); renderHabits(); return; }
  if (t) stopHTimer();
  S.htimer = {hid: h.id, date: today(), startAt: Date.now(), warned: false}; unlockAudio(); save(); renderHabits();
}
function stopHTimer() {
  const t = S.htimer; if (!t) return; S.htimer = null;
  const h = hById(t.hid);
  if (h) { const add = (Date.now() - t.startAt) / 60000; hSet(t.date, h.id, {v: Math.round(((hLog(t.date, h.id)?.v || 0) + add) * 100) / 100}); }
  save();
}
function tickHabitTimer() {
  const t = S.htimer; if (!t) return;
  const h = hById(t.hid); if (!h) { S.htimer = null; save(); return; }
  if (t.date !== today()) { stopHTimer(); renderHabits(); return; }
  const v = hVal(h, t.date), g = hGoal(h);
  if (!h.limit && v >= g) { stopHTimer(); notify(`Target tercapai: ${h.name} 🎉`, fmtM(g)); renderHabits(); return; }
  if (h.limit && v > g && !t.warned) { t.warned = true; save(); notify(`Batas ${h.name} terlampaui`, `Maksimal ${fmtM(g)}`); }
  refreshHabitCard(h.id);
}

/* ---- geser kartu untuk mengisi progres ---- */
(() => {
  let st = null;
  const area = () => $('#view-habits');
  area().addEventListener('pointerdown', e => {
    const card = e.target.closest('.hcard'); if (!card || e.target.closest('.hact')) return;
    st = {card, id: card.dataset.id, x: e.clientX, y: e.clientY, pid: e.pointerId, drag: false, val: null};
  });
  area().addEventListener('pointermove', e => {
    if (!st || e.pointerId !== st.pid) return;
    const dx = e.clientX - st.x, dy = e.clientY - st.y;
    if (!st.drag) {
      if (Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) {
        const h = hById(st.id); if (!h || hFailed(h, hDate) || hDate > today()) { st = null; return; }
        st.drag = true; st.card.classList.add('dragging'); try { st.card.setPointerCapture(e.pointerId); } catch (_) {}
        if (S.htimer && S.htimer.hid === h.id) stopHTimer();
        st.lbl = document.createElement('div'); st.lbl.className = 'hdrag'; st.card.appendChild(st.lbl);
      } else if (Math.abs(dy) > 12) { st = null; return; } else return;
    }
    const h = hById(st.id), g = hGoal(h), r = st.card.getBoundingClientRect();
    const f = clamp((e.clientX - r.left - 8) / (r.width - 16), 0, 1);
    let v;
    if (h.type === 'check') v = f >= .5 ? 1 : 0;
    else if (h.type === 'list') v = Math.round(f * g);
    else { const step = h.type === 'timer' ? (g >= 60 ? 5 : 1) : (g >= 1000 ? 100 : g >= 100 ? 10 : g >= 20 ? 1 : 1); v = Math.round(f * g / step) * step; }
    st.val = v;
    st.card.querySelector('.hfill').style.width = (g ? clamp(v / g, 0, 1) : 0) * 100 + '%';
    st.lbl.textContent = h.type === 'check' ? (v ? '✓' : '–') : h.type === 'timer' ? fmtM(v) : h.type === 'list' ? `${v}/${g}` : fmtNum(v);
  });
  const end = e => {
    if (!st) return;
    if (st.drag) {
      const h = hById(st.id), v = st.val; st.card.classList.remove('dragging'); st.lbl?.remove(); window._hDragEnd = Date.now();
      if (h && v != null) hCommit(h, hDate, () => {
        if (h.type === 'list') hSet(hDate, h.id, {steps: (h.steps || []).slice(0, v).map(s => s.id)});
        else hSet(hDate, h.id, {v});
      });
    }
    st = null;
  };
  area().addEventListener('touchmove', e => { if (st && st.drag) e.preventDefault(); }, {passive: false});
  area().addEventListener('pointerup', end); area().addEventListener('pointercancel', () => { if (st?.drag) { st.card.classList.remove('dragging'); st.lbl?.remove(); renderHabits(); } st = null; });
  area().addEventListener('click', e => {
    if (Date.now() - (window._hDragEnd || 0) < 400) return;
    const b = e.target.closest('.hact'); const card = e.target.closest('.hcard'); if (!card) return;
    const h = hById(card.dataset.id); if (!h) return;
    if (b) { e.stopPropagation(); hAction(h, b.dataset.a, hDate); return; }
    openHabitDetail(h.id);
  });
})();

/* ---- sheet: isi nilai / checklist ---- */
function openValueSheet(h, d) {

    <div class="stepper"><button id="vMinus">−</button><input id="vIn" type="number" inputmode="decimal" value="${cur}" min="0"><button id="vPlus">+</button></div>

    <div class="chips" style="justify-content:center;margin-top:14px">${[step, step * 5].map(x => `<button class="chip" data-add="${x}">+${fmtNum(x)}</button>`).join('')}${h.limit ? '' : `<button class="chip" data-set="${g}">Capai target</button>`}<button class="chip" data-set="0">Nol</button></div>

}

/* =========================================================
   KALENDER & ALARM iPHONE
   1) Pintasan (Shortcuts): DailyJon mengirim baris perintah ke pintasan
      "DailyJon Sinkron" yang membuat/menghapus acara Kalender + alarm Jam.
      Format baris:  TAMBAH|id|judul|YYYY-MM-DD HH:MM|YYYY-MM-DD HH:MM|HH:MM(alarm, boleh kosong)
                     HAPUS|id
   2) File .ics: dibuka iOS → "Tambahkan Semua" ke Kalender (tanpa setup).
   ========================================================= */
let daysDirty = false, syncT = null;
const SYNC_DAYS = 60;
const scClean = s => String(s || '').replace(/[|\r\n]+/g, ' ').trim().slice(0, 80);
const dtTxt = (d, m) => `${d} ${fmtMin(Math.min(m, 1439))}`; // 24:00 → 23:59
function wantAlarm(b, date) {
  if (!S.settings.scAlarm || b.alarm === false) return false;
  const st = parseYmd(date); st.setMinutes(b.start - (+S.settings.remindBefore || 0));
  const diff = st - Date.now();
  return diff > 0 && diff <= 24 * 3600e3; // alarm iPhone hanya tahu jam, jadi kirim untuk ≤24 jam ke depan
}
function alarmTime(b) { return fmtMin(((b.start - (+S.settings.remindBefore || 0)) % 1440 + 1440) % 1440); }
function syncPlan(forceAll) {
  const t = today(), cur = {}, lines = [];
  for (let i = 0; i <= SYNC_DAYS; i++) {
    const d = addDays(t, i);
    for (const b of getDay(d)) {
      if (d === t && b.end <= nowMin()) continue;
      const al = wantAlarm(b, d);
      const hash = [d, b.start, b.end, b.title, al ? alarmTime(b) : ''].join('~');
      cur[b.id] = {d, hash};
      const old = S.synced[b.id];
      if (forceAll || !old || old.hash !== hash) lines.push(['TAMBAH', b.id, scClean(b.title), dtTxt(d, b.start), dtTxt(d, b.end), al ? alarmTime(b) : ''].join('|'));
    }
  }
  for (const [id, o] of Object.entries(S.synced)) if (!cur[id] && o.d >= t) lines.push(`HAPUS|${id}`);
  return {lines, cur};
}
function runShortcut(lines) {
  const name = S.settings.scName || 'DailyJon Sinkron';
  location.href = `shortcuts://run-shortcut?name=${encodeURIComponent(name)}&input=text&text=${encodeURIComponent(lines.join('\n'))}`;
}
function syncNow(forceAll, quiet) {
  if (S.settings.scMode === 'off') { if (!quiet) openCalSheet(); return; }
  const {lines, cur} = syncPlan(forceAll);
  if (!lines.length) { if (!quiet) toast('Kalender iPhone sudah sinkron ✅'); return; }
  // simpan status lama (yang sudah lewat) + status baru
  const keep = {}; for (const [id, o] of Object.entries(S.synced)) if (o.d < today()) keep[id] = o;
  S.synced = {...keep, ...cur}; saveNow();
  toast(`📲 Mengirim ${lines.length} perubahan ke Kalender${S.settings.scAlarm ? ' & Alarm' : ''}…`);
  setTimeout(() => runShortcut(lines), 350);
}
function markDaysDirty() {
  daysDirty = true;

}

function icsHabit(h) {
  if (!h.remindAt) return [];
  const [hh, mm] = h.remindAt.split(':').map(Number), m = hh * 60 + mm, s = h.sched || {k: 'daily'};
  const BY = ['SU','MO','TU','WE','TH','FR','SA'];
  let rr = 'RRULE:FREQ=DAILY';
  if (s.k === 'days') rr = `RRULE:FREQ=WEEKLY;BYDAY=${(s.days || []).map(x => BY[x]).join(',')}`;
  if (s.k === 'dates') rr = `RRULE:FREQ=MONTHLY;BYMONTHDAY=${(s.dates || []).join(',')}`;
  let start = h.created > today() ? h.created : today();
  for (let i = 0; i < 62 && !hSched(h, start); i++) start = addDays(start, 1); // DTSTART harus jatuh di hari yang terjadwal
  return ['BEGIN:VEVENT', `UID:habit-${h.id}@dailyjon`, `DTSTAMP:${icsStamp()}`, `DTSTART:${icsDT(start, m)}`, `DTEND:${icsDT(start, Math.min(1439, m + 15))}`, rr,
    `SUMMARY:${icsEsc(h.icon + ' ' + h.name)}`, `DESCRIPTION:${icsEsc('Kebiasaan DailyJon · ' + goalTxt(h))}`, ...icsAlarm(0, h.name), 'END:VEVENT'];
}
function openICS(text, name) {
  const file = new File([text], name, {type: 'text/calendar'});
  const url = URL.createObjectURL(file);
  // iPhone membuka file .ics dengan pratinjau Kalender → "Tambahkan Semua"
  const w = window.open(url, '_blank');
  if (!w) { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
function exportICS(kind) {
  const t = today(); let ev = [], n = 0, name = 'dailyjon.ics';
  if (kind === 'day' || kind === 'week') {
    const days = kind === 'day' ? [viewDate] : Array.from({length: 7}, (_, i) => addDays(t, i));
    for (const d of days) for (const b of getDay(d)) { if (d === t && b.end <= nowMin()) continue; ev.push(...icsBlock(d, b)); n++; }
    name = kind === 'day' ? `dailyjon-${viewDate}.ics` : `dailyjon-7hari.ics`;
  } else if (kind === 'habits') {
    for (const h of hActive()) { const e = icsHabit(h); if (e.length) { ev.push(...e); n++; } }
    name = 'dailyjon-kebiasaan.ics';
    if (!n) { toast('Belum ada kebiasaan dengan jam pengingat. Atur di Edit kebiasaan → Pengingat.'); return; }
  }
  if (!n) { toast('Tidak ada kegiatan untuk dikirim'); return; }
  openICS(icsWrap(ev), name);
  toast(`📅 ${n} acara siap — ketuk “Tambahkan Semua” di layar Kalender`, {ms: 5000});
}
function exportBlockICS(d, b) { openICS(icsWrap(icsBlock(d, b)), `dailyjon-${scClean(b.title).replace(/\s+/g, '-').toLowerCase() || 'acara'}.ics`); }
function exportHabitICS(h) { const e = icsHabit(h); if (!e.length) { toast('Atur jam pengingat kebiasaan ini dulu (Edit → Pengingat)'); return; } openICS(icsWrap(e), `dailyjon-${h.name.replace(/\s+/g, '-').toLowerCase()}.ics`); }

const ub64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
const pushUrl = () => (S.settings.pushUrl || '').replace(/\/+$/, '');
const pushOn = () => !!(S.settings.pushOn && pushUrl());
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const isStandalone = () => navigator.standalone || matchMedia('(display-mode: standalone)').matches;
let pushT = null, pushLastHash = null;
async function pushApi(path, body) {
  const r = await fetch(pushUrl() + path, body ? {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)} : {});
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
  return j;
}
function pushToken() {
  if (!S.settings.pushToken) { const a = new Uint8Array(24); crypto.getRandomValues(a); S.settings.pushToken = [...a].map(x => x.toString(16).padStart(2, '0')).join(''); saveNow(); }
  return S.settings.pushToken;
}
function pushItems() {
  const now = Date.now(), items = [], t0 = today(), rb = +S.settings.remindBefore || 0;
  const at = (d, m) => { const x = parseYmd(d); x.setMinutes(m); return x.getTime(); };
  for (let i = 0; i < 7; i++) {
    const d = addDays(t0, i), rel = i === 0 ? '' : i === 1 ? 'Besok · ' : '';
    for (const b of getDay(d)) {
      if (!b.remind) continue;
      const t = at(d, b.start - rb);
      if (t > now) items.push({t, title: `⏰ ${b.title}`, body: `${rel}${fmtMin(b.start)}–${fmtMin(b.end)}${rb ? ` · mulai ${rb} menit lagi` : ' · mulai sekarang'}`, tag: `b-${b.id}`});
    }
    for (const h of hActive()) {
      if (!h.remindAt || !hSched(h, d)) continue;
      if (d === t0 && ((hDone(h, d) && !h.limit) || hFailed(h, d))) continue;
      const [hh, mm] = h.remindAt.split(':').map(Number), t = at(d, hh * 60 + mm);
      if (t > now) items.push({t, title: `${h.icon} ${h.name}`, body: h.limit ? `Ingat batasmu: ${goalTxt(h)}` : `Waktunya! Target: ${goalTxt(h)}${hStreak(h) ? ` · jaga streak 🔥${hStreak(h)}` : ''}`, tag: `h-${h.id}-${d}`});
    }
  }
  if (S.timer && S.timer.paused == null && S.timer.endAt > now) items.push({t: S.timer.endAt, title: 'Waktu fokus selesai ✅', body: S.timer.label, tag: 'focus'});
  const ht = S.htimer, hh = ht && hById(ht.hid);
  if (hh) { const left = (hGoal(hh) - hVal(hh, ht.date)) * 60000; if (left > 0) items.push({t: now + left, title: hh.limit ? `Batas ${hh.name} tercapai ⚠️` : `Target tercapai: ${hh.name} 🎉`, body: goalTxt(hh), tag: 'htimer'}); }
  return items.sort((a, b) => a.t - b.t).slice(0, 400);
}
function pushScheduleSoon() { if (!pushOn()) return; clearTimeout(pushT); pushT = setTimeout(pushSchedule, 2500); }
async function pushSchedule(force) {
  if (!pushOn()) return;
  const items = pushItems();
  const hash = JSON.stringify(items.map(i => [i.t, i.title, i.body]));
  if (!force && hash === (pushLastHash ?? S.settings.pushHash)) return;
  try { await pushApi('/schedule', {token: pushToken(), items}); pushLastHash = hash; S.settings.pushHash = hash; S.settings.pushSyncedAt = Date.now(); saveNow(); }
  catch (e) { if (/belum terdaftar/.test(e.message)) { S.settings.pushOn = false; saveNow(); toast('Notifikasi perlu diaktifkan ulang di Setelan'); } }
}
async function pushConnect(url) {
  S.settings.pushUrl = url.trim().replace(/\/+$/, ''); if (S.settings.pushUrl && !/^https:\/\//.test(S.settings.pushUrl)) S.settings.pushUrl = 'https://' + S.settings.pushUrl;
  S.settings.pushKey = ''; saveNow();
  if (!S.settings.pushUrl) return false;
  try { const j = await pushApi('/vapid'); S.settings.pushKey = j.key; saveNow(); return true; }
  catch (e) { toast('Server tidak bisa dihubungi: ' + e.message); return false; }
}
async function pushEnable() {
  if (!pushSupported()) { toast(isStandalone() ? 'Perangkat ini belum mendukung notifikasi web (perlu iOS 16.4+)' : 'Buka DailyJon dari ikon di Layar Utama dulu, lalu aktifkan di sini'); return; }
  if (!S.settings.pushKey) { toast('Hubungkan server push dulu'); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: ub64u(S.settings.pushKey)}); // memunculkan izin notifikasi iPhone
    await pushApi('/subscribe', {token: pushToken(), sub: sub.toJSON()});
    S.settings.pushOn = true; saveNow();
    await pushSchedule(true);
    toast('🔔 Notifikasi aktif!'); renderSettings();
  } catch (e) {
    toast(Notification.permission === 'denied' ? 'Izin notifikasi ditolak — ubah di Pengaturan iPhone › Notifikasi › DailyJon' : 'Gagal mengaktifkan: ' + e.message, {ms: 6000});
  }
}
async function pushDisable() {
  try { await pushApi('/unsubscribe', {token: pushToken()}); } catch (e) {}
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) await sub.unsubscribe(); } catch (e) {}
  S.settings.pushOn = false; S.settings.pushHash = ''; pushLastHash = null; saveNow(); renderSettings(); toast('Notifikasi dimatikan');
}

      let s = tm(parts[0]), e = tm(parts[1]); const title = parts.slice(2).join(' ').trim() || 'Kegiatan';
      if (s == null || e == null) continue; if (e === 0) e = 1440; s = Math.floor(s / 10) * 10; e = Math.ceil(e / 10) * 10; if (e <= s) continue;
      const cat = guessCat(title); placeBlock(m[2], {id: uid(), start: s, end: e, title, cat, note: '', remind: !!S.settings.remindDefault}); done.push(`➕ ${title} ${fmtDateRel(m[2])} ${fmtMin(s)}–${fmtMin(e)}`);
    } else if (m[1].toLowerCase() === 'hapus') {
      const b = findBlock(m[2], parts.join(' ')); if (b) { setDay(m[2], getDay(m[2]).filter(x => x.id !== b.id)); done.push(`🗑️ ${b.title} (${fmtDateRel(m[2])})`); }
    }
  }
  let finalText = out.replace(/^\s*AKSI:.*$/gim, '').trim() || 'Oke.';
  if (done.length) { save(); renderAll(); finalText += '\n\n' + done.join('\n'); msg.undoK = k; }
  msg.text = finalText; msg.typing = false; save(); renderChat();
}

/* ---------------- Chat UI ---------------- */
function fmtMsg(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
function msgHtml(m) {
  let acts = '';
  if (m.plan && !m.applied) acts += `<button class="pri" data-act="apply" data-id="${m.id}">Terapkan</button>`;
  if (m.applied) acts += `<button disabled>✓ Diterapkan</button>`;
  if (m.goto) acts += `<button data-act="goto" data-id="${m.id}">Lihat di grid</button>`;
  if (m.gotoH) acts += `<button data-act="gotoH" data-id="${m.id}">Buka Kebiasaan</button>`;
  if (m.undoK && undoSnap && undoSnap.key === m.undoK) acts += `<button data-act="undo" data-id="${m.id}">Urungkan</button>`;
  return `<div class="msg ${m.role}${m.typing ? ' typing' : ''}" id="m-${m.id}"><div class="tx">${fmtMsg(m.text)}</div>${acts ? `<div class="acts">${acts}</div>` : ''}</div>`;
}
function renderChat() {
  const box = $('#chatLog');
  if (!S.chat.length) box.innerHTML = msgHtml({id: 'w', role: 'ai', text: `Hai! Aku Jon ✨\nAku bisa mengatur jadwal (tambah, pindah, hapus, cari waktu luang, susun rutinitas) dan kebiasaanmu (buat kebiasaan, catat progres, cek streak) — cukup ketik seperti ngobrol.\n\nCoba: “olahraga besok jam 6 pagi 1 jam”.`});
  else box.innerHTML = S.chat.map(msgHtml).join('');
  box.innerHTML += `<div class="sugs" id="sugs">${['Apa sekarang?', 'Progres kebiasaan', 'Jadwal hari ini', 'Waktu kosong hari ini', 'Tambah kebiasaan minum air 8 gelas', 'Susun rutinitas pagi besok', 'Rencanakan belajar 2 jam besok', 'Streak kebiasaan', 'Statistik minggu ini', 'Tips fokus', 'Bantuan'].map(s => `<button class="chip">${s}</button>`).join('')}</div>`;
  $$('#sugs .chip').forEach(b => b.onclick = () => sendChat(b.textContent));
  scrollChat();
}
function scrollChat() { if (view === 'ai') requestAnimationFrame(() => scrollTo(0, document.body.scrollHeight)); }
function pushMsg(m) {
  m.id = m.id || uid(); S.chat.push(m); if (S.chat.length > 80) S.chat = S.chat.slice(-80); save(); renderChat(); return m;
}
async function sendChat(text) {
  text = (text || '').trim(); if (!text) return;
  pushMsg({role: 'me', text}); $('#chatIn').value = '';
  const r = localAI(text);
  if (r.handled) { pushMsg({role: 'ai', text: r.text, undoK: r.undoK, plan: r.plan, goto: r.goto, gotoH: r.gotoH}); return; }
  if (llm.engine) { await llmReply(text); return; }
  if (llm.loading) { pushMsg({role: 'ai', text: 'AI Pintar sedang dimuat, tunggu sebentar ya… Sementara itu aku bisa bantu perintah jadwal biasa.\n\n' + HELP}); return; }
  pushMsg({role: 'ai', text: r.text});
}
$('#chatLog').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const m = S.chat.find(x => x.id === b.dataset.id); if (!m) return;
  if (b.dataset.act === 'apply' && m.plan) {
    const k = snap(); m.plan.blocks.forEach(x => placeBlock(m.plan.date, {id: uid(), note: '', remind: !!S.settings.remindDefault, ...x}));
    m.applied = true; m.undoK = k; save(); renderAll(); renderChat(); toast(`${m.plan.blocks.length} kegiatan ditambahkan`, {undoK: k});
  }
  if (b.dataset.act === 'undo') { undo(m.undoK); renderChat(); }
  if (b.dataset.act === 'gotoH') show('habits');
  if (b.dataset.act === 'goto' && m.goto) { show('plan'); setDate(m.goto.date); setTimeout(() => scrollToHour(Math.max(0, Math.floor(m.goto.start / 60) - 1)), 50); }
});
$('#chatSend').onclick = () => sendChat($('#chatIn').value);
$('#chatIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendChat($('#chatIn').value); } });

/* =========================================================
   Navigasi & siklus aplikasi
   ========================================================= */
const scrollPos = {};
function show(v) {
  if (v === view) { if (v === 'plan') scrollToHour(); return; }
  scrollPos[view] = scrollY; view = v; document.body.classList.toggle('v-ai', v === 'ai');
  $$('.view').forEach(x => x.classList.toggle('active', x.id === 'view-' + v));
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.v === v));
  $('#chatbar').hidden = v !== 'ai';
  renderHeader();
  if (v === 'habits') renderHabits();
  if (v === 'stats') renderStats();
  if (v === 'focus') renderFocus();
  if (v === 'set') renderSettings();
  if (v === 'ai') { renderChat(); setAIStatus(llm.status); }
  if (v === 'plan') { renderNow(); renderBlocks(); scrollTo(0, scrollPos.plan ?? 0); } else if (v !== 'ai') scrollTo(0, 0);
}
$$('#tabs button').forEach(b => b.onclick = () => show(b.dataset.v));
function renderAll() { renderHeader(); renderNow(); renderBlocks(); renderHabits(); if (view === 'stats') renderStats(); if (view === 'focus') renderFocus(); }

// keyboard iPhone: jaga kolom chat & sheet tetap terlihat
if (window.visualViewport) {
  const vv = visualViewport;
  const onVV = () => { const kb = Math.max(0, innerHeight - vv.height - vv.offsetTop); document.body.classList.toggle('kb', kb > 80); document.documentElement.style.setProperty('--kb', (kb > 80 ? kb : 0) + 'px'); };
  vv.addEventListener('resize', onVV); vv.addEventListener('scroll', onVV);
}

// tips pasang di iPhone (hanya saat dibuka di Safari, belum dipasang)
(function installTip() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  if (!ios || standalone || S.settings.hideInstall) return;
  const el = $('#installTip'); el.hidden = false;
  el.innerHTML = `<span style="font-size:22px">📲</span><span style="flex:1">Pasang DailyJon: ketuk <b>Bagikan</b> lalu <b>Tambahkan ke Layar Utama</b>.</span><button id="itX" class="muted" style="font-size:18px;padding:4px">✕</button>`;
  $('#itX').onclick = () => { S.settings.hideInstall = true; save(); el.hidden = true; };
})();

// loop: tiap detik untuk timer, tiap 20 detik untuk garis waktu & pengingat
let lastDay = today(), lastMinute = -1;
setInterval(() => {
  tickTimer(); tickHabitTimer();
  const d = today();
  if (d !== lastDay) { const wasToday = viewDate === lastDay, wasH = hDate === lastDay; lastDay = d; if (wasToday) viewDate = d; if (wasH) hDate = d; renderAll(); }
  const m = nowMin();
  if (m !== lastMinute) { lastMinute = m; if (view === 'plan') { renderNow(); renderNowLine(); $$('#grid .seg').length && viewDate === d && renderBlocks(); } checkReminders(); checkHabitReminders(); }
}, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { lastMinute = -1; renderAll(); setTimeout(syncOnOpen, 800); setTimeout(() => pushSchedule(), 1500); } });

// mulai
applyTheme(); buildGrid(); renderAll(); setAIStatus(llm.status);
requestAnimationFrame(() => scrollToHour());
if (S.settings.startTab && S.settings.startTab !== 'plan') show(S.settings.startTab);
setTimeout(syncOnOpen, 1500);
setTimeout(() => pushSchedule(), 2500);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
try { navigator.storage?.persist?.(); } catch (e) {}
if (S.settings.aiAuto && S.settings.aiLoadedOnce && navigator.gpu) setTimeout(loadLLM, 1500);
</script>
